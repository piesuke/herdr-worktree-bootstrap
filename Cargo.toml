[package]
name = "herdr-worktree-bootstrap"
version = "0.1.0"
edition = "2024"
description = "Bootstrap a new worktree: copy gitignored files, install deps, run hooks"
license = "MIT"
repository = "https://github.com/piesuke/herdr-worktree-bootstrap"
readme = "README.md"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "1.1"

[dev-dependencies]
tempfile = "3"

# The library target is auto-discovered from src/lib.rs as
# `herdr_worktree_bootstrap`; the binary below is a thin wrapper over it so the
# bootstrap lifecycle stays testable from `tests/`.
[[bin]]
name = "herdr-worktree-init"
path = "src/main.rs"
