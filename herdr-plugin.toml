id = "piesuke.herdr.worktree.bootstrap"
name = "WorktreeBootstrap"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Apply project layouts"
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["cargo", "fetch"]

[[build]]
command = ["cargo", "build", "--release"]
platforms = ["linux", "macos"]

[[startup]]
command = ["cargo", "run", "--release", "--bin", "restore"]

[[actions]]
id = "apply"
title = "Apply layout"
contexts = ["workspace"]
command = ["cargo", "run", "--release", "--bin", "apply"]

# On worktree.created, run the bootstrap binary. It reads per-repo settings
# (copy / install / hooks) from `.herdr/bootstrap.toml` inside each repo — see
# examples/bootstrap.toml for the schema.
[[events]]
on = "worktree.created"
command = ["./target/release/herdr-worktree-init"]
