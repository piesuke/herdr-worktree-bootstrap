version: 2

updates:
  # Cargo.lock is committed and CI runs `--locked`, so a stale lockfile is a
  # stale build for everyone who installs the plugin.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch bumps of direct deps are noise one at a time; review them together.
      cargo-patch:
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
