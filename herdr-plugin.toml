id = "piesuke.herdr.worktree.bootstrap"
name = "WorktreeBootstrap"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Bootstrap a new worktree: copy gitignored files, install deps, run hooks"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "fetch"]

[[build]]
command = ["cargo", "build", "--release"]

# On worktree.created, run the bootstrap binary. It reads per-repo settings
# (copy / install / hooks) from `.herdr/worktree-bootstrap.toml` inside each repo
# — see examples/worktree-bootstrap.toml for the schema.
[[events]]
on = "worktree.created"
command = ["./target/release/herdr-worktree-init"]

# Opened by the plugin when a bootstrap fails, on a report file whose path
# arrives in $WORKTREE_BOOTSTRAP_REPORT. A toast — and herdr's own dialog —
# truncates the line that says why it failed; a pane is a real terminal that
# doesn't.
#
# `less` is what keeps the pane open and scrollable; the `cat` fallback is for a
# machine without it, where a pane that closed instantly would read as a crash.
[[panes]]
id = "failure"
title = "Bootstrap failure"
placement = "overlay"
command = [
  "sh",
  "-c",
  'less -R -- "$WORKTREE_BOOTSTRAP_REPORT" || { cat -- "$WORKTREE_BOOTSTRAP_REPORT"; printf "\npress enter to close "; read _; }',
]
