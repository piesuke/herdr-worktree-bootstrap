id = "piesuke.herdr.worktree.bootstrap"
name = "WorktreeBootstrap"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Apply project layouts"
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["cargo", "fetch"]

[[build]]
command = ["cargo", "build", "--release"]
platforms = ["linux", "macos"]

[[startup]]
command = ["cargo", "run", "--release", "--bin", "restore"]

[[actions]]
id = "apply"
title = "Apply layout"
contexts = ["workspace"]
command = ["cargo", "run", "--release", "--bin", "apply"]

[[events]]
on = "worktree.created"
command = ["./target/release/herdr-worktree-init"]

[copy]
enabled = true
files = [
  ".env",
  ".env.local",
  ".env.development.local",
]

[install]
enabled = true
# Built-in detection covers node / rust / go / python / ruby / php / java /
# elixir / dart out of the box. Add custom rules for anything else — they are
# checked before the built-ins, so they can also override one.
# [[install.rules]]
# marker = "flake.nix"
# command = ["nix", "develop", "--command", "true"]

# Arbitrary commands, run in order inside the new worktree.
# Any non-zero exit aborts the whole bootstrap.
[[commands]]
command = ["direnv", "allow"]

[[commands]]
command = ["cargo", "build"]
