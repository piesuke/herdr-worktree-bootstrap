name: Feature request
description: Something the plugin should do that it can't
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do, and where does the plugin get in the way?
        Describe the situation rather than the fix — the fix is easier to judge
        with the situation in front of it.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you'd like instead
      description: If you have a config shape in mind, sketch it.
      render: toml
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: What you do today
      description: >
        A `[[hooks.post]]` running `sh -c` covers a lot of ground. If that
        already works, say so — it's useful to know whether this is a
        convenience or a genuine gap.
    validations:
      required: false
